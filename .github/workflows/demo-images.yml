name: demo images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - demos/hello_clearpath/**
      - demos/auto_explore_clearpath/**
      - .github/workflows/demo-images.yml
  pull_request:
    paths:
      - demos/hello_clearpath/**
      - demos/auto_explore_clearpath/**
      - .github/workflows/demo-images.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo:
          - hello_clearpath
          - auto_explore_clearpath
    name: ${{ matrix.demo }} image
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clearpath_community_demos
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: demos/${{ matrix.demo }}/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:jazzy-${{ matrix.demo }}-pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.demo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.demo }}

      - name: Build and Push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: demos/${{ matrix.demo }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:jazzy-${{ matrix.demo }}-latest
            ${{ env.IMAGE_NAME }}:jazzy-${{ matrix.demo }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.demo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.demo }}
