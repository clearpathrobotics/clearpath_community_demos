# Clearpath robot.yaml for Husky A200 running FusionCore sensor fusion.
#
# Hardware:
#   IMU: Microstrain 3DM-GX5-25 connected via USB (/dev/microstrain_main)
#   GPS: u-blox F9P (launched separately via ublox_gps_node; not in Clearpath
#        sensor registry, so launch_enabled is false here)
#
# Replace a200-0000 with your robot's serial number in both serial_number and
# namespace below (a200-0000 -> a200_0000: dashes become underscores).
#
# Topics FusionCore subscribes to (namespace prefix from serial_number above):
#   /<namespace>/sensors/imu_0/data  -> remapped to /imu/data
#   /<namespace>/platform/odom       -> remapped to /odom/wheels
#   /fix                             -> GPS fix from ublox_gps_node (no remap)

serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp
platform:
  controller: ps4
  attachments: []
sensors:
  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        port: /dev/microstrain_main
        frame_id: imu_link
        use_enu_frame: true
        imu_data_rate: 100
