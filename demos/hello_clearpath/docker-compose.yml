# docker-compose.yml - hello_clearpath + clearpath_docker (Jazzy only)
#
# This compose stack launches:
#   - Profile `sim`: Gazebo simulation + RViz + hello_clearpath
#   - Profile `robot`: hello_clearpath against a running host robot stack
#
# Required once per shell before first run (X11):
#   xhost +local:
#
# Override knobs (all optional):
#   SETUP_PATH_HOST  Host setup directory containing robot.yaml
#                    (default: ./config)
#   SETUP_PATH       Setup path in containers (default: /etc/clearpath/)
#   ROBOT_SETUP_PATH_HOST Host setup directory for robot profile (default: /etc/clearpath/)
#   ROBOT_SETUP_PATH      Setup path in robot-profile containers (default: /etc/clearpath/)
#   HELLO_LANGUAGE   cpp | python
#   USE_SIM_TIME     true | false (default: true for sim, false for robot)
#   WAIT_FOR_SIM     Wait for sim /clock and odometry before starting
#                    (default: true for sim, false for robot)
#   WAIT_FOR_TIMEOUT_SEC  Seconds to wait for them (default: 120)
#
# The ROS domain, middleware, and discovery settings come from robot.yaml
# (system.ros2) in the setup directory, as on a robot.
#
# Usage:
#   docker compose --profile sim up
#   docker compose --profile robot up
#
# GPU acceleration (NVIDIA — requires NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yaml --profile sim up

services:
  setup_init:
    image: alpine:3.20
    container_name: cpr-setup-init-jazzy
    command: >
      sh -lc "
        mkdir -p /etc/clearpath &&
        if [ ! -f /etc/clearpath/robot.yaml ]; then
          cp /seed/robot.yaml /etc/clearpath/robot.yaml;
        fi &&
        chmod -R a+rwX /etc/clearpath
      "
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath
      - ./config/robot.yaml:/seed/robot.yaml:ro

  sim:
    image: ghcr.io/clearpathrobotics/clearpath_docker:jazzy-sim-latest
    container_name: cpr-sim-jazzy
    profiles: ["sim"]
    network_mode: host
    ipc: host
    environment:
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath/
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
    depends_on:
      setup_init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true

  viz:
    image: ghcr.io/clearpathrobotics/clearpath_docker:jazzy-viz-latest
    container_name: cpr-viz-jazzy
    profiles: ["sim"]
    network_mode: host
    ipc: host
    devices:
      - /dev/dri:/dev/dri
    environment:
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath/:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
    depends_on:
      setup_init:
        condition: service_completed_successfully
      sim:
        condition: service_started
    stdin_open: true
    tty: true

  hello_clearpath:
    image: ghcr.io/clearpathrobotics/clearpath_community_demos:jazzy-hello_clearpath-latest
    container_name: cpr-hello-clearpath-jazzy
    profiles: ["sim"]
    network_mode: host
    ipc: host
    environment:
      WAIT_FOR_SIM: ${WAIT_FOR_SIM:-true}
      WAIT_FOR_TIMEOUT_SEC: ${WAIT_FOR_TIMEOUT_SEC:-120}
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
    command: >
      ros2 launch hello_clearpath hello_clearpath.launch.py
        language:=${HELLO_LANGUAGE:-cpp}
        use_sim_time:=${USE_SIM_TIME:-true}
        setup_path:=${SETUP_PATH:-/etc/clearpath}
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath/:ro
    depends_on:
      setup_init:
        condition: service_completed_successfully
      sim:
        condition: service_healthy
    stdin_open: true
    tty: true

  hello_clearpath_robot:
    image: ghcr.io/clearpathrobotics/clearpath_community_demos:jazzy-hello_clearpath-latest
    container_name: cpr-hello-clearpath-robot-jazzy
    profiles: ["robot"]
    network_mode: host
    ipc: host
    environment:
      WAIT_FOR_SIM: ${WAIT_FOR_SIM:-false}
      SETUP_PATH: ${ROBOT_SETUP_PATH:-/etc/clearpath/}
    command: >
      ros2 launch hello_clearpath hello_clearpath.launch.py
        language:=${HELLO_LANGUAGE:-cpp}
        use_sim_time:=${USE_SIM_TIME:-false}
        setup_path:=${ROBOT_SETUP_PATH:-/etc/clearpath/}
    volumes:
      - ${ROBOT_SETUP_PATH_HOST:-/etc/clearpath/}:/etc/clearpath/:ro
    stdin_open: true
    tty: true
