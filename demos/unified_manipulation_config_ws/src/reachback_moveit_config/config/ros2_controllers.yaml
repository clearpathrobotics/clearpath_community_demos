# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    base_joint_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    base_joint_to_twist_controller:
      type: joint_to_twist_controller/JointToTwistController

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
      - arm_joint_5
      - arm_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

# See here for reference https://github.com/bmagyar/control.ros.org/blob/b0cb3429909d3dd88af2625195f8cd04e8fd3c63/doc/resources/urdfs%20and%20yamls/example_controllers.yaml#L123
base_joint_controller:
  ros__parameters:
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: true # disables PID
    allow_integration_in_goal_trajectories: true
    joints:
      - base_joint/x
      - base_joint/y
      - base_joint/theta
    command_joints:
      - base_joint_to_twist_controller/linear/x
      - base_joint_to_twist_controller/linear/y
      - base_joint_to_twist_controller/angular/z

base_joint_to_twist_controller:
  ros__parameters:
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity
    command_joints:
      - mecanum_drive_controller/linear/x/velocity
      - mecanum_drive_controller/linear/y/velocity
      - mecanum_drive_controller/angular/z/velocity

# Source: https://github.com/clearpathrobotics/clearpath_common/blob/02714d883bb22c57621d2979b44fde1652e52937/clearpath_control/config/r100/control/omni_4wd.yaml#L10
# CHANGELOG:
# - Remove wheel_separation_multiplier and wheel_radius_multiplier, which are only applicable to diff_drive_controller
# - Set enable_odom_tf to true to publish odom->base_link transform

mecanum_drive_controller:
  ros__parameters:
    interface_name: velocity

    command_joint_names: ["front_left_wheel_joint", "rear_left_wheel_joint", "rear_right_wheel_joint", "front_right_wheel_joint"]

    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"

    kinematics.base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
    kinematics.wheels_radius: 0.0759
    kinematics.sum_of_robot_center_projection_on_X_Y_axis: 0.5945

    publish_rate: 20.0
    reference_timeout: 0.1
    use_stamped_vel: True

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

    cmd_vel_timeout: 0.5

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true
    tf_frame_prefix_enable: false

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.3
    linear.x.min_velocity: -1.3
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    linear.y.has_velocity_limits: true
    linear.y.has_acceleration_limits: true
    linear.y.has_jerk_limits: false
    linear.y.max_velocity: 1.3
    linear.y.min_velocity: -1.3
    linear.y.max_acceleration: 1.0
    linear.y.min_acceleration: -1.0
    linear.y.max_jerk: 0.0
    linear.y.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 4.0
    angular.z.min_velocity: -4.0
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0

gripper_controller:
  ros__parameters:
    joints:
      - arm_finger_b_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
