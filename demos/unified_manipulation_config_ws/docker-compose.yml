services:
  devcontainer:
    build:
      args:
        - ROS_VERSION=jazzy
        - WORKSPACE=/workspaces/mobile_manipulation
      context: docker
      dockerfile: Dockerfile
    image: ghcr.io/clearpathrobotics/unified-manipulation-config:latest
    environment:
      - DISPLAY=${DISPLAY}
      - DEBIAN_FRONTEND=noninteractive
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - USERNAME=administrator
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
    volumes:
      - .:/workspaces/mobile_manipulation
      - ./ccache:/home/administrator/.ccache
      - /tmp/.X11-unix:/tmp/.X11-unix
    mem_limit: 16g
    working_dir: /workspaces/mobile_manipulation
    command: /bin/bash
    network_mode: host
    ulimits:
      rtprio: 99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
