# docker-compose.yml - auto_explore_clearpath + clearpath_docker (Jazzy)
#
# This stack launches:
#   - Gazebo simulation
#   - Nav2 + SLAM
#   - RViz visualization
#   - Auto frontier explorer demo node
#
# Usage:
#   cd demos/auto_explore_clearpath
#   xhost +local:
#   docker compose up --build
#
# With NVIDIA GPU:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yaml up --build
#
# sim and nav2 use the health checks built into the clearpath_docker images.
# Every container takes its ROS domain, middleware, and discovery settings from
# config/robot.yaml (system.ros2), with the CycloneDDS profile config/cyclonedds.xml.

services:
  setup_init:
    image: alpine:3.20
    container_name: cpr-setup-init-auto-explore-jazzy
    command: >
      sh -lc "
        mkdir -p /etc/clearpath/maps &&
        test -f /etc/clearpath/robot.yaml &&
        chmod -R a+rwX /etc/clearpath
      "
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath

  sim:
    image: ghcr.io/clearpathrobotics/clearpath_docker:jazzy-sim-latest
    container_name: cpr-sim-auto-explore-jazzy
    network_mode: host
    ipc: host
    environment:
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      GAZEBO_STARTUP_TIMEOUT: ${GAZEBO_STARTUP_TIMEOUT:-120}
      GAZEBO_MAX_RESTARTS: ${GAZEBO_MAX_RESTARTS:-3}
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath/
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
    depends_on:
      setup_init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true

  nav2:
    image: ghcr.io/clearpathrobotics/clearpath_docker:jazzy-nav2-latest
    container_name: cpr-nav2-auto-explore-jazzy
    network_mode: host
    environment:
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      WAIT_FOR_SIM: ${NAV2_WAIT_FOR_SIM:-true}
      NAV2_ENABLE_SLAM: ${NAV2_ENABLE_SLAM:-true}
      NAV2_SLAM_SYNC: ${NAV2_SLAM_SYNC:-false}
      AUTO_NAV2_STARTUP: ${AUTO_NAV2_STARTUP:-true}
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath/:ro
      - ${SETUP_PATH_HOST:-./config}/maps:/etc/clearpath/maps:rw  # rw: cpr-nav2 save-map writes here
    depends_on:
      setup_init:
        condition: service_completed_successfully
      sim:
        condition: service_healthy
    stdin_open: true
    tty: true

  auto_explore:
    # Pulls the published image, or builds it here if it isn't published; --build rebuilds it
    image: ghcr.io/clearpathrobotics/clearpath_community_demos:jazzy-auto_explore_clearpath-latest
    pull_policy: missing
    container_name: cpr-auto-explore-jazzy
    build:
      context: ../..
      dockerfile: demos/auto_explore_clearpath/Dockerfile
    network_mode: host
    ipc: host
    environment:
      WAIT_FOR_SIM: ${WAIT_FOR_SIM:-true}
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
    command: >
      ros2 launch auto_explore_clearpath auto_explore.launch.py
        use_sim_time:=${AUTO_EXPLORE_USE_SIM_TIME:-true}
        setup_path:=${SETUP_PATH:-/etc/clearpath}
        max_goal_distance_m:=${AUTO_EXPLORE_MAX_GOAL_DISTANCE_M:-8.5}
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath/:ro
    depends_on:
      setup_init:
        condition: service_completed_successfully
      nav2:
        condition: service_healthy
    stdin_open: true
    tty: true

  viz:
    image: ghcr.io/clearpathrobotics/clearpath_docker:jazzy-viz-latest
    container_name: cpr-viz-auto-explore-jazzy
    network_mode: host
    ipc: host
    devices:
      - /dev/dri:/dev/dri
    environment:
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      CLEARPATH_VIZ_CONFIG: ${CLEARPATH_VIZ_CONFIG:-navigation}
    volumes:
      - ${SETUP_PATH_HOST:-./config}:/etc/clearpath/:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
    depends_on:
      setup_init:
        condition: service_completed_successfully
      sim:
        condition: service_started
    stdin_open: true
    tty: true
