# Example robot.yaml for auto_explore_clearpath, tested on a simulated Husky
# A300. To use another robot, edit (see "Changing the robot" on the demo's page):
#   serial_number          the robot's serial number; its prefix (a300, j100,
#                          ...) selects the platform
#   system.ros2.namespace  the robot's namespace; the demo runs under it
#   system.ros2.domain_id  the ROS domain ID (0 to 101)
#   system.hosts           the robot computer's hostname and IP (real robots)
#   platform.attachments   must belong to the platform; for another platform,
#                          start from its clearpath_config sample instead
#   sensors.lidar2d        keep a 2D lidar as the first entry: SLAM and Nav2
#                          use its scan (sensors/lidar2d_0/scan). It must see
#                          beside and behind its mount so the map covers the
#                          robot; widen angle_min/angle_max if it's limited to
#                          the front (as in the Warthog sample)
# Keep the middleware settings: the demo's containers rely on them.
serial_number: a300-00000
version: 0
system:
  hosts:
    - hostname: cpr-a300-0000
      ip: 192.168.131.1
  ros2:
    namespace: a300_0000
    domain_id: 0
    middleware:
      implementation: rmw_cyclonedds_cpp
      automatic_discovery_range: localhost
      # In the setup directory, so every container has it
      profile: /etc/clearpath/cyclonedds.xml
platform:
  controller: ps4
  attachments:
    - name: top_plate
      type: a300.top_plate
      model: default
      parent: default_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      enabled: true
sensors:
  lidar2d:
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_front_mount
      xyz: [-0.1, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          angle_min: -3.141592653589793
          angle_max: 3.141592653589793
